[package]
name = "imagerail"
version = "0.1.0"
description = "ImageRail / 画轨"
authors = ["Star-Fish-C"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde_json = "1"
rfd = "0.14"
ureq = "2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
avif-decode = { version = "=1.0.2", default-features = false }
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["sync"] }
